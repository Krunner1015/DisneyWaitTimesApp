<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MagicRoute</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e88e5">
</head>

<body>

    <h1>🏰 MagicRoute</h1>
    <p class="subtitle">Disney Wait Times</p>

    <div class="park-grid">

        <button class="park-button active" data-park="6">
            🏰<br>Magic Kingdom
        </button>

        <button class="park-button" data-park="5">
            🌐<br>Epcot
        </button>

        <button class="park-button" data-park="7">
            🎬<br>Hollywood Studios
        </button>

        <button class="park-button" data-park="8">
            🌳<br>Animal Kingdom
        </button>

    </div>

    <p class="updated-time" id="updatedTime"></p>

    <hr>

    <div id="rides"></div>

    <p class="credit">
        Powered by
        <a href="https://queue-times.com/en-US" target="_blank">
            Queue-Times.com
        </a>
    </p>

    <script src="rides.js"></script>
    <script src="script.js"></script>

</body>

</html>
